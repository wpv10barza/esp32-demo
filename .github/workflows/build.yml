name: Build ESP32-S3 firmware

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Validate Windows PowerShell syntax
        shell: pwsh
        run: |
          foreach ($file in @('./FIX_AND_FLASH.ps1', './WAVESHARE_USB_BOOT.ps1')) {
            $source = Get-Content -LiteralPath $file -Raw
            $null = [scriptblock]::Create($source)
            Write-Host "$file syntax OK"
          }

          $flasher = Get-Content -LiteralPath ./FIX_AND_FLASH.ps1 -Raw
          if ($flasher -notmatch '\[string\]\$Port\s*=\s*"AUTO"') {
            throw 'FIX_AND_FLASH.ps1 must default to Port=AUTO'
          }
          if ($flasher -notmatch '\[switch\]\$IdentifyOnly') {
            throw 'FIX_AND_FLASH.ps1 must provide the safe IdentifyOnly mode'
          }
          $preflight = $flasher.IndexOf('$ResolvedPort = Resolve-Esp32S3Port')
          $compile = $flasher.IndexOf('Write-Step "Compilando para Waveshare ESP32-S3"')
          if ($preflight -lt 0 -or $compile -lt 0 -or $preflight -gt $compile) {
            throw 'Physical ESP32-S3 validation must happen before firmware compilation'
          }
          if ($flasher -notmatch 'ESP32-D0WD-V3') {
            throw 'Classic ESP32 incompatibility must be explicit'
          }

          $usbHelper = Get-Content -LiteralPath ./WAVESHARE_USB_BOOT.ps1 -Raw
          foreach ($required in @('VID_303A', 'CH340', 'Bluetooth', 'BOOT', 'FIX_AND_FLASH.ps1')) {
            if (-not $usbHelper.Contains($required)) {
              throw "WAVESHARE_USB_BOOT.ps1 is missing required guard: $required"
            }
          }

          Write-Host "PowerShell syntax, native USB routing and chip preflight OK"

      - name: Validate Windows launchers and native USB routing
        shell: bash
        run: |
          set -euo pipefail
          if grep -Eqi 'set[[:space:]]+PORT=COM[0-9]+|-Port[[:space:]]+COM[0-9]+' RUN_FIX_AND_FLASH.bat PULL_AND_FLASH.bat IDENTIFY_BOARD.bat IDENTIFY_HARDWARE.bat; then
            echo 'A Windows launcher hardcodes a COM port' >&2
            exit 1
          fi
          grep -q 'WAVESHARE_USB_BOOT.ps1' RUN_FIX_AND_FLASH.bat
          grep -q 'RUN_FIX_AND_FLASH.bat' PULL_AND_FLASH.bat
          grep -q -- '-IdentifyOnly' IDENTIFY_BOARD.bat
          grep -q -- '-IdentifyOnly' IDENTIFY_HARDWARE.bat
          grep -q 'esp32:esp32:esp32s3' FIX_AND_FLASH.ps1
          grep -q 'VID_303A' WAVESHARE_USB_BOOT.ps1
          grep -q 'VID_1A86' WAVESHARE_USB_BOOT.ps1
          grep -q 'CONFIG_IDF_TARGET_ESP32S3' Waveshare_Next_Meeting.ino
          grep -q 'WAVESHARE_HARDWARE_GUARD' Waveshare_Next_Meeting.ino
          grep -q 'getFlashChipSize' Waveshare_Next_Meeting.ino
          grep -q 'psramFound' Waveshare_Next_Meeting.ino
          echo 'Windows launchers use native USB detection and preserve the ESP32-S3 target'

      - name: Validate Waveshare hardware profile
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'ESP32-S3R8' HARDWARE_PROFILE.md
          grep -q '8 MB embedded PSRAM' HARDWARE_PROFILE.md
          grep -q '16 MB' HARDWARE_PROFILE.md
          grep -q 'ESP32-D0WD-V3' HARDWARE_PROFILE.md
          grep -q 'USB-SERIAL CH340' HARDWARE_PROFILE.md
          grep -q 'must never be treated as an ESP32-S3 target' HARDWARE_PROFILE.md
          grep -q 'FlashSize=16M,PSRAM=opi' HARDWARE_PROFILE.md
          echo 'Hardware profile rejects classic ESP32/CH340 and preserves S3R8 requirements'

      - name: Install Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Install ESP32 Arduino core 3.3.11
        run: |
          arduino-cli config init --overwrite
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.3.11

      - name: Download pinned Waveshare patched GFX
        shell: bash
        env:
          WAVESHARE_SHA: 225a62bff11b5d0a0b607873860d39485a9a9685
        run: |
          set -euo pipefail
          curl -fL "https://github.com/waveshareteam/ESP32-S3-Touch-AMOLED-2.16/archive/${WAVESHARE_SHA}.zip" -o /tmp/waveshare.zip
          mkdir -p /tmp/waveshare
          unzip -q /tmp/waveshare.zip -d /tmp/waveshare
          GFX_DIR="$(find /tmp/waveshare -type d -path '*/examples/arduino/libraries/GFX_Library_for_Arduino' -print -quit)"
          test -n "$GFX_DIR"
          grep -q 'gfxSpiFrequencyToClockDiv' "$GFX_DIR/src/databus/Arduino_ESP32SPI.cpp"
          grep -q 'spiFrequencyToClockDiv(spi, freq)' "$GFX_DIR/src/databus/Arduino_ESP32SPI.cpp"
          echo "GFX_DIR=$GFX_DIR" >> "$GITHUB_ENV"

      - name: Stage sketch with non-secret CI values
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/Waveshare_Next_Meeting
          mkdir -p /tmp/Waveshare_Next_Meeting
          cp Waveshare_Next_Meeting.ino /tmp/Waveshare_Next_Meeting/Waveshare_Next_Meeting.ino
          cat > /tmp/Waveshare_Next_Meeting/secrets.h <<'EOF'
          #pragma once
          #define WIFI_SSID_VALUE "CI_WIFI"
          #define WIFI_PASSWORD_VALUE "CI_PASSWORD"
          #define CALENDAR_URL_VALUE "https://example.invalid/exec"
          EOF

      - name: Compile ESP32-S3 firmware (must succeed)
        run: |
          arduino-cli compile \
            --fqbn esp32:esp32:esp32s3 \
            --board-options CDCOnBoot=cdc,FlashSize=16M,PSRAM=opi \
            --library "$GFX_DIR" \
            --warnings all \
            /tmp/Waveshare_Next_Meeting

      - name: Compile as classic ESP32 (must be rejected)
        shell: bash
        run: |
          set +e
          arduino-cli compile \
            --fqbn esp32:esp32:esp32 \
            --library "$GFX_DIR" \
            --warnings all \
            /tmp/Waveshare_Next_Meeting \
            > /tmp/classic-esp32-build.log 2>&1
          status=$?
          set -e

          cat /tmp/classic-esp32-build.log
          if [[ $status -eq 0 ]]; then
            echo 'Classic ESP32 compiled unexpectedly; hardware guard failed' >&2
            exit 1
          fi
          grep -q 'WAVESHARE_HARDWARE_GUARD' /tmp/classic-esp32-build.log
          echo 'Classic ESP32 correctly rejected by the compile-time hardware guard'
